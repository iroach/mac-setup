# When a maintainer adds the "approved" label to a "Build speed results" issue,
# check its rows, add them to speed-tests/build-results.csv, rebuild the README
# summary, and open a pull request that closes the issue.
#
# Only people with triage access or more can add labels, so nobody else can start
# this. The issue body is untrusted: it reaches the job only through the
# ISSUE_BODY environment variable and is only checked and copied, never run.
name: Import build results

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: import-build-results
  cancel-in-progress: false

jobs:
  import:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'build-results')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the results branch
      pull-requests: write   # open the pull request
      issues: write          # comment on the issue
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Install zsh (for build-summary.sh)
        run: sudo apt-get install -y -qq zsh >/dev/null

      - name: Check and add the rows
        id: rows
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 -I speed-tests/import-results.py "$ISSUE" 2> error.txt
          zsh speed-tests/build-summary.sh

      - name: Open a pull request
        run: |
          branch="build-results/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add speed-tests/build-results.csv speed-tests/README.md
          git commit -q -m "Build speed results from #$ISSUE"
          git push -q --force origin "$branch"
          url=$(gh pr list --head "$branch" --json url -q '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "Build speed results from #$ISSUE" \
              --body "Adds the results from #$ISSUE to \`speed-tests/build-results.csv\` and rebuilds the summary in \`speed-tests/README.md\`. Check the rows, then merge.

          Closes #$ISSUE")
          fi
          gh issue comment "$ISSUE" --body "Thanks! The results passed the checks and are in $url. They'll be added when it's merged."

      - name: Report a problem
        if: failure()
        run: |
          {
            echo "These results couldn't be added:"
            echo
            echo '```'
            # The error quotes the submitted values; drop backticks so they stay inside the code block.
            { tr -d '`' < error.txt; } 2>/dev/null | head -20 | grep . || echo "The import job failed; see the Actions log."
            echo '```'
            echo
            echo "Edit the issue to fix the rows, then remove and re-add the \`approved\` label."
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md
